name: Build & Publish APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "supabase.url=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "supabase.api=${{ secrets.SUPABASE_KEY }}" >> local.properties

      - name: Restore keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ~/.android/debug.keystore

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Publish APK via GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh release view current --repo aguss101/aguss101.github.io > /dev/null 2>&1 \
            || gh release create current \
                 --repo aguss101/aguss101.github.io \
                 --title "Bocado APK" \
                 --notes "Versión más reciente"
          gh release upload current \
            --repo aguss101/aguss101.github.io \
            --clobber \
            "app/build/outputs/apk/release/app-release.apk#bocado.apk"
