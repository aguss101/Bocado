name: Build & Publish APK

on:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: Desarrollo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'

      - name: Flutter pub get (módulo)
        working-directory: Desarrollo/flutter_module
        run: flutter pub get

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "supabase.url=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "supabase.api=${{ secrets.SUPABASE_KEY }}" >> local.properties

      - name: Restore keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ~/.android/debug.keystore

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PciVersionCode=${{ github.run_number }} \
            -PciVersionName=1.1.${{ github.run_number }}

      - name: Publish APK + version.json to web repo (GitHub Pages)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          META=app/build/outputs/apk/release/output-metadata.json
          VCODE=$(jq -r '.elements[0].versionCode' "$META")
          VNAME=$(jq -r '.elements[0].versionName' "$META")
          git clone https://x-access-token:${GH_PAT}@github.com/aguss101/aguss101.github.io.git web-repo
          mkdir -p web-repo/downloads
          cp app/build/outputs/apk/release/app-release.apk web-repo/downloads/bocado.apk
          printf '{ "versionCode": %s, "versionName": "%s" }\n' "$VCODE" "$VNAME" > web-repo/version.json
          cd web-repo
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add downloads/bocado.apk version.json
          git diff --staged --quiet || git commit -m "chore: update APK to v$VNAME ($VCODE) [skip ci]"
          git push
